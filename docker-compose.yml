
services:
  # Database
  mysql:
    image: mysql:8.4
    container_name: sigmabrain-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - sigmabrain-network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Backend ExpressJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: sigmabrain-backend
    restart: unless-stopped

    environment:
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}

    ports:
      - "3000:3000"

    command: "pnpm dev"

    volumes:
      - ./backend:/app
      - /app/node_modules

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - sigmabrain-network

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: sigmabrain-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    networks:
      - sigmabrain-network

volumes:
  mysql_data:

networks:
  sigmabrain-network:
    driver: bridge
