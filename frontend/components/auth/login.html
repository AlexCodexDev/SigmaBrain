<div id="screen-login" class="screen active">
    <div class="w-full max-w-md bg-white/90 backdrop-blur-md p-8 rounded-[2.5rem] shadow-2xl border-4 border-indigo-100 flex flex-col items-center relative z-10">
        <!-- Maskot Login -->
        <div class="bg-indigo-50 rounded-full p-3 mb-2 border-4 border-indigo-200 shadow-inner">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=LoginBot&backgroundColor=transparent" alt="Avatar" class="w-20 h-20 bounce-anim">
        </div>

        <h1 class="glitch mb-1 text-center text-3xl" data-text="SigmaBrain">SigmaBrain</h1>
        <p class="text-indigo-800 mb-4 text-center font-bold text-sm">Sistem Pembelajaran & Database Lokal Browser</p>

        <!-- Tab Switcher Login/Register -->
        <div class="flex w-full bg-indigo-100 p-1 rounded-xl mb-4 border border-indigo-200">
            <button id="tab-btn-login" onclick="switchAuthTab('login')" class="w-1/2 py-2 rounded-lg font-extrabold text-sm transition-all bg-white text-indigo-900 shadow-sm">Masuk</button>
            <button id="tab-btn-register" onclick="switchAuthTab('register')" class="w-1/2 py-2 rounded-lg font-extrabold text-sm transition-all text-indigo-600 hover:text-indigo-900">Daftar Akun</button>
        </div>

        <!-- Form Autentikasi -->
        <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="w-full flex flex-col gap-3">
            <div>
                <label class="block text-indigo-950 font-extrabold mb-1 text-xs uppercase tracking-wider">Nama Pemain</label>
                <input type="text" id="login-username" required placeholder="Contoh: MichaelGamers" class="w-full px-4 py-3 rounded-xl border-2 border-indigo-200 focus:border-indigo-500 focus:outline-none text-indigo-950 font-bold transition-all bg-indigo-50/50">
            </div>
            <div>
                <label class="block text-indigo-950 font-extrabold mb-1 text-xs uppercase tracking-wider">Kata Sandi</label>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border-2 border-indigo-200 focus:border-indigo-500 focus:outline-none text-indigo-950 font-bold transition-all bg-indigo-50/50">
            </div>
            
            <button id="auth-submit-btn" type="submit" class="mt-2 w-full btn-interactive btn-3d bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl text-xl shadow-[0_5px_0_#312e81]">
                🚀 Masuk & Main
            </button>
        </form>

        <div class="w-full flex items-center my-4">
            <div class="flex-grow border-t border-indigo-200"></div>
            <span class="px-3 text-xs text-indigo-400 font-bold uppercase">atau</span>
            <div class="flex-grow border-t border-indigo-200"></div>
        </div>

        <button onclick="loginAsGuest()" class="w-full btn-interactive btn-3d bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold py-3 rounded-xl text-lg shadow-[0_4px_0_#b45309]">
            🎮 Main sebagai Tamu (Guest)
        </button>
    </div>
</div>
